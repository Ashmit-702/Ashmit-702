<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Currently interning at Cerebro Tech." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1124"/><stop offset="1" stop-color="#141232"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b7cf0" stop-opacity=".6"/><stop offset=".5" stop-color="#262a46"/><stop offset="1" stop-color="#8a63e6" stop-opacity=".5"/></linearGradient>
<radialGradient id="gl" cx=".08" cy=".5" r=".6"><stop offset="0" stop-color="#4c6ef5" stop-opacity=".22"/><stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<linearGradient id="tr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7cf0" stop-opacity=".1"/><stop offset="1" stop-color="#b79bff" stop-opacity=".9"/></linearGradient>
</defs>
<style>
.f{animation:f 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes f{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.p1{transform-box:fill-box;transform-origin:center;animation:p 3.4s ease-out infinite}
.p2{transform-box:fill-box;transform-origin:center;animation:p 3.4s ease-out 1.1s infinite}
@keyframes p{0%{transform:scale(.7);opacity:.7}100%{transform:scale(2.6);opacity:0}}
</style>
<rect x=".5" y=".5" width="999" height="149" rx="20" fill="url(#bg)" stroke="url(#bd)"/>
<rect x=".5" y=".5" width="999" height="149" rx="20" fill="url(#gl)"/>
<rect x=".5" y=".5" width="999" height="149" rx="20" fill="url(#grid)"/>
<circle class="p1" cx="70" cy="75" r="9" fill="none" stroke="#8b9bff" stroke-width="1.5"/>
<circle class="p2" cx="70" cy="75" r="9" fill="none" stroke="#8b9bff" stroke-width="1.5"/>
<circle cx="70" cy="75" r="7.5" fill="#8b9bff"/><circle cx="70" cy="75" r="3" fill="#0e1124"/>
<text class="f" x="116" y="62" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="3" fill="#7f86aa" style="animation-delay:.3s">NOW</text>
<text class="f" x="114" y="98" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="29" font-weight="600" letter-spacing="-.4" fill="#f3f5ff" style="animation-delay:.8s">Currently interning at Cerebro Tech.</text>
<g transform="translate(786 0)">
<line x1="0" y1="75" x2="170" y2="75" stroke="#2a2e4a" stroke-width="2"/>
<line x1="0" y1="75" x2="170" y2="75" stroke="url(#tr)" stroke-width="2" stroke-dasharray="170"><animate attributeName="stroke-dashoffset" values="170;0" dur="2.6s" begin=".6s" fill="freeze"/></line>
<circle cx="0" cy="75" r="3.5" fill="#3b4170"/><circle cx="56" cy="75" r="3.5" fill="#3b4170"/><circle cx="112" cy="75" r="3.5" fill="#3b4170"/>
<circle cx="170" cy="75" r="5" fill="#b79bff"><animate attributeName="opacity" values="0;0;1" keyTimes="0;.9;1" dur="2.6s" begin=".6s" fill="freeze"/></circle>
<circle cx="170" cy="75" r="5" fill="none" stroke="#b79bff"><animate attributeName="r" values="5;16" dur="3s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="3s" begin="3.2s" repeatCount="indefinite"/></circle>
</g>
</svg>