<svg width="440" height="372" viewBox="0 0 440 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dadi Ki Dawai: A multilingual AI health companion with an Indian grandmother's voice." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bgf0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10111b"/><stop offset="1" stop-color="#14112a"/></linearGradient>
<radialGradient id="glf0" cx=".9" cy=".05" r=".75"><stop offset="0" stop-color="#7c5cf0" stop-opacity=".16"/><stop offset="1" stop-color="#7c5cf0" stop-opacity="0"/></radialGradient>
<linearGradient id="swf0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b9bff" stop-opacity="0"/><stop offset=".5" stop-color="#b4bfff" stop-opacity=".9"/><stop offset="1" stop-color="#8b9bff" stop-opacity="0"/></linearGradient></defs>
