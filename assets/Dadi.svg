<rect x=".5" y=".5" width="439" height="371" rx="16" fill="url(#glf0)"/>
<text x="26" y="44" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="2.4" fill="#a898ff">HEALTH  ·  LLM</text><text x="26" y="86" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="650" letter-spacing="-.6" fill="#f2f4ff">Dadi Ki Dawai</text><text x="26" y="112" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a3a9c8">A multilingual AI health companion with an</text><text x="26" y="131" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a3a9c8">Indian grandmother's voice.</text><rect x="26" y="158" width="388" height="1" fill="#ffffff" fill-opacity=".07"/><rect x="26" y="174" width="6" height="6" rx="1.5" fill="#6b78e0" fill-opacity=".9"/><text x="44" y="182" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">Replies in Hindi, Hinglish or English, matching</text><text x="44" y="200" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">each new message</text><rect x="26" y="218" width="6" height="6" rx="1.5" fill="#6b78e0" fill-opacity=".9"/><text x="44" y="226" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">Structured triage: urgency score, likely</text><text x="44" y="244" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">conditions and red flags</text><rect x="26" y="262" width="6" height="6" rx="1.5" fill="#6b78e0" fill-opacity=".9"/><text x="44" y="270" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">Reads lab reports from photos with Groq vision;</text><text x="44" y="288" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">rotates Groq keys on rate limits</text><rect x="26" y="320" width="388" height="1" fill="#ffffff" fill-opacity=".07"/><text x="26" y="346" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#7e85a8">Flask · Groq · PWA · Render</text>
