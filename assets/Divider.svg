<svg width="1000" height="18" viewBox="0 0 1000 18" xmlns="http://www.w3.org/2000/svg" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b9bff" stop-opacity="0"/><stop offset=".5" stop-color="#8b9bff" stop-opacity=".55"/><stop offset="1" stop-color="#8b9bff" stop-opacity="0"/></linearGradient>
<linearGradient id="hi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#e2e7ff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="0" y="8" width="1000" height="2"/></clipPath>
</defs>
<style>
.dr{transform-origin:500px 9px;animation:dr 2.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes dr{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.dm{animation:dm 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dm{0%,100%{opacity:.5;transform:rotate(45deg) scale(1)}50%{opacity:1;transform:rotate(45deg) scale(1.35)}}
</style>
<rect class="dr" x="0" y="8.5" width="1000" height="1" fill="url(#ln)"/>
<g clip-path="url(#c)"><rect y="7" width="260" height="4" fill="url(#hi)"><animate attributeName="x" values="-280;1020" dur="12s" begin="2.2s" repeatCount="indefinite"/></rect></g>
<rect class="dm" x="496" y="5" width="8" height="8" fill="#b4bfff"/>
</svg>