<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitWicket: GitHub and LeetCode activity mapped to a six-stat cricket player card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0e16"/><stop offset="1" stop-color="#12101f"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5866c9" stop-opacity=".55"/><stop offset=".5" stop-color="#2a2d45"/><stop offset="1" stop-color="#8a63e6" stop-opacity=".5"/></linearGradient>
<radialGradient id="gl" cx=".8" cy=".2" r=".7"><stop offset="0" stop-color="#7c5cf0" stop-opacity=".16"/><stop offset="1" stop-color="#7c5cf0" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c3ccff"/></linearGradient>
</defs>
<style>
.fl{stroke-dasharray:3 7;animation:fl 5s linear infinite}
@keyframes fl{to{stroke-dashoffset:-40}}
.rg{animation:rg 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rg{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<rect x=".5" y=".5" width="999" height="329" rx="20" fill="url(#bg)" stroke="url(#bd)"/>
<rect x=".5" y=".5" width="999" height="329" rx="20" fill="url(#gl)"/>
<rect x=".5" y=".5" width="999" height="329" rx="20" fill="url(#grid)"/>
<rect x="48" y="52" width="22" height="1.5" fill="#9f8bff"/>
<text x="80" y="57" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3.4" fill="#a898ff">SPECIAL MENTION</text>
<text x="48" y="128" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="650" letter-spacing="-1" fill="url(#nm)">GitWicket</text>
<text x="48" y="168" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9aa1c0">Developer profiles, rated as</text>
<text x="48" y="192" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#9aa1c0">cricket player cards.</text>
<text x="48" y="290" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="1.6" fill="#6d7397">CRICKET CARD   ·   COMPARE   ·   CAREER CARD</text>
<rect x="478" y="104" width="104" height="34" rx="9" fill="#12131d" stroke="#2c3050"/><text x="530" y="126" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#d4d9f5">GitHub</text>
<rect x="478" y="150" width="104" height="34" rx="9" fill="#12131d" stroke="#2c3050"/><text x="530" y="172" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#d4d9f5">LeetCode</text>
