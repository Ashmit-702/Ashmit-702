></g><g><rect x="887" y="150" width="66" height="34" rx="9" fill="#12131d" stroke="#2c3050"><animate attributeName="stroke" values="#2c3050;#5866c9;#2c3050" dur="9s" begin="5.5s" repeatCount="indefinite"/></rect><text x="920.0" y="172" text-anchor="middle" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="1.2" fill="#c3c9ee">CAT</text></g>
