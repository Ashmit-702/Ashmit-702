lvetica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">Vanilla JavaScript on a 2D canvas, no framework</text><rect x="26" y="320" width="388" height="1" fill="#ffffff" fill-opacity=".07"/><text x="26" y="346" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#7e85a8">Python · Vercel · Gemini · Vanilla JS · Canvas</text>
