<svg width="440" height="372" viewBox="0 0 440 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NetaBoard: Politics, with receipts." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
