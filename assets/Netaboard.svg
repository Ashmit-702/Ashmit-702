etica,Arial,sans-serif" font-size="12.5" fill="#c6cbe6">refreshes and unit tests</text><rect x="26" y="320" width="388" height="1" fill="#ffffff" fill-opacity=".07"/><text x="26" y="346" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#7e85a8">Next.js 14 · Supabase · PostgreSQL · Vercel Cron</text>
