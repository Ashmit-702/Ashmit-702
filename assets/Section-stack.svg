<svg width="1000" height="132" viewBox="0 0 1000 132" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="05 Tech Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0e14"/><stop offset="1" stop-color="#12141f"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#8fa0c8" stop-opacity=".5"/><stop offset="1" stop-color="#8fa0c8" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#5866c9" stop-opacity=".38"/><stop offset="1" stop-color="#5866c9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".05"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="44 44" dur="60s" repeatCount="indefinite"/></pattern>
<linearGradient id="vm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
<mask id="gm"><rect width="1000" height="132" fill="url(#vm)"/></mask>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fa0c8"/><stop offset="1" stop-color="#5866c9" stop-opacity="0"/></linearGradient>
<linearGradient id="hi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="1000" height="132" rx="20"/></clipPath>
<clipPath id="al"><rect x="48" y="104" width="300" height="2"/></clipPath>
</defs>
<style>
.t{animation:t 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes t{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.ln{animation:ln 1.8s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes ln{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="132" fill="url(#bg)"/>
<g filter="url(#soft)">
<circle r="150" fill="url(#g1)" cx="150" cy="40"><animate attributeName="cx" values="150;330;150" dur="28s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<circle r="170" fill="url(#g2)" cx="820" cy="120"><animate attributeName="cx" values="820;640;820" dur="34s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
</g>
<rect width="1000" height="132" fill="url(#grid)" mask="url(#gm)"/>
</g>
<rect x=".5" y=".5" width="999" height="131" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<text class="t" x="48" y="42" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="3" fill="#8fa0c8" style="fill-opacity:.95">05</text>
<text class="t" x="952" y="42" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2.6" fill="#8b91b2" style="animation-delay:.2s">CORE TOOLS</text>
<text class="t" x="46" y="94" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="650" letter-spacing="-1" fill="#f3f5ff" style="animation-delay:.1s">Tech Stack</text>
<rect class="ln" x="48" y="104" width="300" height="2" rx="1" fill="url(#ac)" style="transform-origin:48px 105px"/>
<g clip-path="url(#al)"><rect y="103" width="70" height="4" fill="url(#hi)"><animate attributeName="x" values="20;380" dur="6s" begin="2.4s" repeatCount="indefinite"/></rect></g>
</svg>