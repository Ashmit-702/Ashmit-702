<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashmit Singh. B.Tech Computer Engineering, 2023-2027" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d1c"/><stop offset=".5" stop-color="#0e1230"/><stop offset="1" stop-color="#120f2e"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#3f63f0" stop-opacity=".62"/><stop offset="1" stop-color="#3f63f0" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#7c5cf0" stop-opacity=".5"/><stop offset="1" stop-color="#7c5cf0" stop-opacity="0"/></radialGradient>
<radialGradient id="b3"><stop offset="0" stop-color="#cfd8ff" stop-opacity=".16"/><stop offset="1" stop-color="#cfd8ff" stop-opacity="0"/></radialGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa8ff" stop-opacity="0"/><stop offset=".5" stop-color="#d6dcff" stop-opacity=".95"/><stop offset="1" stop-color="#9aa8ff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".055"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="56 56" dur="48s" repeatCount="indefinite"/></pattern>
<radialGradient id="vg" cx=".5" cy=".5" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gm"><rect width="1000" height="420" fill="url(#vg)"/></mask>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<clipPath id="card"><rect width="1000" height="420" rx="24"/></clipPath>
<clipPath id="nameclip"><text x="500" y="240" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="112" font-weight="650" letter-spacing="-3">Ashmit Singh</text></clipPath>
<clipPath id="hl"><rect x="380" y="306" width="240" height="1.6"/></clipPath>
</defs>
<style>
.up{animation:up 1.9s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ring{transform-origin:500px 210px;animation:spin 140s linear infinite}
.ring2{transform-origin:500px 210px;animation:spin 200s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.br{transform-origin:500px 210px;animation:br 14s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="420" fill="url(#bg)"/>
<g filter="url(#soft)">
<circle r="270" fill="url(#b1)" cx="260" cy="140"><animate attributeName="cx" values="260;470;260" dur="36s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="140;260;140" dur="36s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<circle r="250" fill="url(#b2)" cx="760" cy="300"><animate attributeName="cx" values="760;560;760" dur="42s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="300;170;300" dur="42s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<circle r="200" fill="url(#b3)" cx="500" cy="60"><animate attributeName="cx" values="500;640;500" dur="50s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="60;120;60" dur="50s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
</g>
<rect width="1000" height="420" fill="url(#grid)" mask="url(#gm)"/>
<circle class="br" cx="500" cy="210" r="250" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
<circle class="ring" cx="500" cy="210" r="332" fill="none" stroke="#9aa8ff" stroke-opacity=".14" stroke-dasharray="2 14"/>
<circle class="ring2" cx="500" cy="210" r="396" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-dasharray="1 22"/>
<rect width="1000" height="420" filter="url(#noise)" opacity=".045"/>
</g>
<rect x=".5" y=".5" width="999" height="419" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
<text class="up" x="500" y="240" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="112" font-weight="650" letter-spacing="-3" fill="#f4f6ff">Ashmit Singh</text>
<g clip-path="url(#nameclip)"><rect y="114" width="150" height="150" fill="url(#gl)" transform="skewX(-18)"><animate attributeName="x" values="-300;1100" dur="9s" begin="2.4s" repeatCount="indefinite"/></rect></g>
<text class="up" x="500" y="296" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" letter-spacing="3.2" fill="#b3b9d3" style="animation-delay:.6s">B.Tech Computer Engineering  ·  2023–2027</text>
<rect x="380" y="306" width="240" height="1.6" fill="#ffffff" fill-opacity=".12"/>
<g clip-path="url(#hl)"><rect y="305" width="80" height="3.4" fill="url(#ln)"><animate attributeName="x" values="330;640" dur="7s" repeatCount="indefinite"/></rect></g>
</svg>