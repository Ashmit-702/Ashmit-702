<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashmit Singh. B.Tech Computer Engineering, 2023-2027" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b10"/><stop offset=".6" stop-color="#0f1018"/><stop offset="1" stop-color="#0b0b12"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#4c6ef5" stop-opacity=".55"/><stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#845ef7" stop-opacity=".45"/><stop offset="1" stop-color="#845ef7" stop-opacity="0"/></radialGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e4e8ff"/><stop offset="1" stop-color="#b9c2ff"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa8ff" stop-opacity="0"/><stop offset=".5" stop-color="#c7cfff" stop-opacity=".9"/><stop offset="1" stop-color="#9aa8ff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<radialGradient id="vg" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gm"><rect width="1000" height="300" fill="url(#vg)"/></mask>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="card"><rect width="1000" height="300" rx="20"/></clipPath>
<clipPath id="hl"><rect x="425" y="222" width="150" height="1.5"/></clipPath>
</defs>
<style>
.up{animation:up 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="300" fill="url(#bg)"/>
<g filter="url(#soft)">
<circle r="210" fill="url(#b1)" cx="300" cy="120"><animate attributeName="cx" values="300;420;300" dur="30s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="120;170;120" dur="30s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<circle r="190" fill="url(#b2)" cx="720" cy="200"><animate attributeName="cx" values="720;600;720" dur="34s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="200;140;200" dur="34s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
</g>
<rect width="1000" height="300" fill="url(#grid)" mask="url(#gm)"/>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
<text class="up" x="500" y="152" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="74" font-weight="600" letter-spacing="-1.5" fill="url(#nm)">Ashmit Singh</text>
<text class="up" x="500" y="196" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" letter-spacing="2.2" fill="#8d93ae" style="animation-delay:.5s">B.Tech Computer Engineering  ·  2023–2027</text>
<rect x="425" y="222" width="150" height="1.5" fill="#ffffff" fill-opacity=".10"/>
<g clip-path="url(#hl)"><rect y="221" width="60" height="3" fill="url(#sw)"><animate attributeName="x" values="380;580" dur="7s" repeatCount="indefinite"/></rect></g>
</svg>
