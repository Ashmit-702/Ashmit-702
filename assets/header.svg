<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashmit Singh. B.Tech Computer Engineering, 2023-2027" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08090e"/><stop offset=".55" stop-color="#0e0f18"/><stop offset="1" stop-color="#0a0a12"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#4c6ef5" stop-opacity=".6"/><stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#845ef7" stop-opacity=".5"/><stop offset="1" stop-color="#845ef7" stop-opacity="0"/></radialGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e6eaff"/><stop offset="1" stop-color="#b6c0ff"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa8ff" stop-opacity="0"/><stop offset=".5" stop-color="#d0d7ff" stop-opacity=".95"/><stop offset="1" stop-color="#9aa8ff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".05"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="56 56" dur="40s" repeatCount="indefinite"/></pattern>
<radialGradient id="vg" cx=".5" cy=".48" r=".62"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gm"><rect width="1000" height="440" fill="url(#vg)"/></mask>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="card"><rect width="1000" height="440" rx="24"/></clipPath>
<clipPath id="hl"><rect x="400" y="292" width="200" height="1.6"/></clipPath>
</defs>
<style>
.up{animation:up 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ring{transform-origin:500px 210px;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.br{animation:br 12s ease-in-out infinite;transform-origin:500px 210px}
@keyframes br{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="440" fill="url(#bg)"/>
<g filter="url(#soft)">
<circle r="260" fill="url(#b1)" cx="280" cy="150"><animate attributeName="cx" values="280;440;280" dur="34s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="150;250;150" dur="34s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
<circle r="240" fill="url(#b2)" cx="740" cy="290"><animate attributeName="cx" values="740;580;740" dur="38s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="cy" values="290;190;290" dur="38s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
</g>
<rect width="1000" height="440" fill="url(#grid)" mask="url(#gm)"/>
<circle class="br" cx="500" cy="210" r="250" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
<circle class="ring" cx="500" cy="210" r="330" fill="none" stroke="#9aa8ff" stroke-opacity=".10" stroke-dasharray="2 14"/>
</g>
<rect x=".5" y=".5" width="999" height="439" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<text class="up" x="500" y="236" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="108" font-weight="600" letter-spacing="-2.5" fill="url(#nm)">Ashmit Singh</text>
<text class="up" x="500" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" letter-spacing="3" fill="#9298b4" style="animation-delay:.5s">B.Tech Computer Engineering  ·  2023–2027</text>
<rect x="400" y="292" width="200" height="1.6" fill="#ffffff" fill-opacity=".10"/>
<g clip-path="url(#hl)"><rect y="291" width="70" height="3.4" fill="url(#sw)"><animate attributeName="x" values="350;620" dur="8s" repeatCount="indefinite"/></rect></g>
</svg>
